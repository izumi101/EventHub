name: PR title

# Pull request titles must follow Conventional Commits, because squash merges
# use the title as the commit message and release-please derives the version
# bump and changelog from it.
#
# This deliberately uses the `pull_request` event and NOT `pull_request_target`:
# the latter runs with a write token and secrets in the context of the base
# branch, which is the classic "pwn request" setup. Validation only needs the
# title from the event payload, so a read-only token is enough (for fork PRs
# GitHub downgrades the token to read-only anyway). No code from the PR is
# checked out or executed.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  semantic-title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-z].*$
          subjectPatternError: |
            The subject "{subject}" in the pull request title "{title}" must
            start with a lower-case letter (e.g. "feat(api): add refund endpoint").
