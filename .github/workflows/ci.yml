name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EventHub/backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: eventhub
          POSTGRES_USER: eventhub_user
          POSTGRES_PASSWORD: eventhub_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eventhub_user -d eventhub"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: eventhub
      POSTGRES_USER: eventhub_user
      POSTGRES_PASSWORD: eventhub_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: EventHub/backend/requirements.lock
      - name: Install dependencies
        run: pip install -r requirements.lock ruff pip-audit
      - name: Lint (pyflakes rules)
        run: ruff check --select F,E9 --exclude "*/migrations/*" .
      - name: Migrations are up to date
        # Not a test run: without DEBUG the settings refuse the dev secret key.
        env:
          DJANGO_DEBUG: "1"
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (PostgreSQL, real transactions)
        run: python manage.py test --noinput
      - name: Dependency audit
        # twisted (via daphne) has no stable release with these fixes yet
        # (only 26.10.0rc1); drop the ignores once it ships.
        run: >-
          pip-audit -r requirements.lock --progress-spinner off
          --ignore-vuln CVE-2026-106454 --ignore-vuln CVE-2026-115778
          --ignore-vuln CVE-2026-115774 --ignore-vuln CVE-2026-115775
          --ignore-vuln CVE-2026-115776 --ignore-vuln CVE-2026-115877

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EventHub/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EventHub/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unit tests (Vitest)
        run: npm test
      - name: Production build (type-checks templates, enforces bundle budgets)
        run: npm run build -- --configuration production
      - name: Audit dependencies (runtime and dev)
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EventHub
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose files are valid
        run: |
          docker compose --env-file .env.example config -q
          GRAFANA_ADMIN_PASSWORD=ci docker compose -f docker-compose.monitoring.yml config -q
      - name: Build backend image (without the PyTorch layer)
        run: docker build --build-arg INSTALL_SEMANTIC_SEARCH=0 -t eventhub-backend ./backend
      - name: Build frontend image
        run: docker build -t eventhub-frontend ./frontend
      - name: nginx config is valid in the image
        run: >-
          docker run --rm --add-host backend:127.0.0.1 eventhub-frontend
          sh -c '/docker-entrypoint.d/10-self-signed-cert.sh && nginx -t'

  search-image:
    # The full backend image: CPU-only PyTorch and the embedding model baked
    # in, so semantic search works without network access at runtime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image with semantic search
        run: docker build --build-arg INSTALL_SEMANTIC_SEARCH=1 -t eventhub-backend-search EventHub/backend
      - name: CPU-only torch, model works offline
        run: >-
          docker run --rm --network none --entrypoint python eventhub-backend-search -c
          "import torch; assert not torch.cuda.is_available() and '+cpu' in torch.__version__, torch.__version__;
          from sentence_transformers import SentenceTransformer;
          v = SentenceTransformer('all-MiniLM-L6-v2').encode('concert in Almaty');
          assert len(v) == 384; print('torch', torch.__version__, 'embedding', len(v))"
      - name: Image size
        run: docker image ls eventhub-backend-search --format '{{.Size}}'

  e2e:
    # The whole stack as a developer runs it: docker compose up with the
    # example .env (DEBUG, mock payments, demo data), then a browser test.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EventHub
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cp .env.example .env
          sed -i 's/^INSTALL_SEMANTIC_SEARCH=.*/INSTALL_SEMANTIC_SEARCH=0/' .env
          docker compose up -d --build --wait --wait-timeout 600
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EventHub/frontend/package-lock.json
      - name: Install Playwright
        working-directory: EventHub/frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser tests against the running stack
        working-directory: EventHub/frontend
        env:
          E2E_BASE_URL: http://localhost:4200
        run: npx playwright test
      - name: The worker sent the queued sign-up email
        # The worker polls every 2 s; give it a moment after the last test.
        run: |
          for i in $(seq 1 30); do
            docker compose logs worker | grep -q "Your verification code is" && exit 0
            sleep 1
          done
          docker compose logs worker
          exit 1
      - name: Stack logs
        if: failure()
        run: docker compose logs --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: EventHub/frontend/playwright-report
