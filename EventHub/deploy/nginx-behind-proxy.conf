# nginx server config for production, where Caddy (deploy/Caddyfile)
# terminates TLS in front of it. docker-compose.prod.yml mounts this file
# over the image's /etc/nginx/conf.d/default.conf (frontend/nginx.conf).
#
# nginx publishes no port in production: only containers on the compose
# network reach it, and the only one that sends it traffic is Caddy, which
# replaces any client-supplied X-Forwarded-For / X-Forwarded-Proto with its
# own values. So this hop is trusted for both:
#  - the client address: $remote_addr becomes the address Caddy saw, and the
#    locations snippet passes it on as the single X-Forwarded-For entry the
#    backend trusts (REST_FRAMEWORK NUM_PROXIES=1, i.e. per-client throttling);
#  - the scheme: Django sees https (SECURE_PROXY_SSL_HEADER).

set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;

map $http_x_forwarded_proto $eventhub_forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 80 default_server;
    server_name _;

    # Caddy enforces the same body limit (CADDY_MAX_BODY); /api/ sets 10m.
    include /etc/nginx/snippets/eventhub-locations.conf;
}
