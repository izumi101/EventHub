# Defaults here are safe for a server (DEBUG off, no demo data, no fake
# payments). For local development copy .env.example to .env — it turns on
# DEBUG, mock payments and demo data.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: eventhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventhub}
      POSTGRES_USER: ${POSTGRES_USER:-eventhub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eventhub_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        INSTALL_SEMANTIC_SEARCH: ${INSTALL_SEMANTIC_SEARCH:-1}
    container_name: eventhub_backend
    restart: unless-stopped
    environment: &backend-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env (see .env.example)}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:4200,https://localhost}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:4200,https://localhost}
      DJANGO_SEED_DATA: ${DJANGO_SEED_DATA:-0}
      DJANGO_SEED_ADMIN_PASSWORD: ${DJANGO_SEED_ADMIN_PASSWORD:-}
      DJANGO_COLLECTSTATIC: ${DJANGO_COLLECTSTATIC:-0}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      POSTGRES_DB: ${POSTGRES_DB:-eventhub}
      # Schema owner: migrate and setup_db_roles in entrypoint.sh run as it.
      POSTGRES_USER: ${POSTGRES_USER:-eventhub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Least-privilege roles (docs/DATABASE_ROLES.md), created and updated
      # by setup_db_roles on every start. With POSTGRES_APP_PASSWORD set,
      # gunicorn and the worker connect as POSTGRES_APP_USER (no DDL);
      # empty keeps the old behaviour (connect as the owner, with a warning),
      # so an .env from before the roles existed still starts.
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-eventhub_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
      # SELECT-only role for reports and `manage.py run_sql_checks`.
      POSTGRES_READONLY_USER: ${POSTGRES_READONLY_USER:-eventhub_readonly}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Payments (docs/adr/0001-payment-provider-layer.md): every enabled
      # provider must be configured when DJANGO_DEBUG=0.
      # .env.example enables freedompay for the demo (KZT events).
      PAYMENT_PROVIDERS_ENABLED: ${PAYMENT_PROVIDERS_ENABLED:-stripe}
      PAYMENTS_MOCK_MODE: ${PAYMENTS_MOCK_MODE:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Deprecated name of PAYMENTS_MOCK_MODE, read only while that is empty.
      STRIPE_MOCK_MODE: ${STRIPE_MOCK_MODE:-0}
      # Freedom Pay (KZT events). The demo points FREEDOMPAY_API_URL at the
      # fpay-emulator service below (never a real gateway); a real deployment
      # uses https://api.freedompay.kz and an https FREEDOMPAY_RESULT_URL.
      # With DJANGO_DEBUG=0 the emulator needs FREEDOMPAY_DEMO_MODE=1.
      FREEDOMPAY_API_URL: ${FREEDOMPAY_API_URL:-}
      FREEDOMPAY_MERCHANT_ID: ${FREEDOMPAY_MERCHANT_ID:?Set FREEDOMPAY_MERCHANT_ID in .env (see .env.example)}
      FREEDOMPAY_SECRET_KEY: ${FREEDOMPAY_SECRET_KEY:?Set FREEDOMPAY_SECRET_KEY in .env (see .env.example)}
      # Where the gateway sends Result notifications (inside compose: the backend).
      FREEDOMPAY_RESULT_URL: ${FREEDOMPAY_RESULT_URL:-http://backend:8000/api/v1/payments/callback/freedompay/}
      FREEDOMPAY_TESTING_MODE: ${FREEDOMPAY_TESTING_MODE:-0}
      FREEDOMPAY_DEMO_MODE: ${FREEDOMPAY_DEMO_MODE:-0}
      # SMTP (docs/NOTIFICATIONS.md). Empty user/password: emails are only
      # printed in the worker log (console backend).
      EMAIL_BACKEND: ${EMAIL_BACKEND:-}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-EventHub <no-reply@eventhub.local>}
      # Time zone of the dates in notification emails.
      NOTIFICATION_TIME_ZONE: ${NOTIFICATION_TIME_ZONE:-}
      JOBS_RUN_INLINE: ${JOBS_RUN_INLINE:-0}
      # gunicorn worker processes per backend container (default: CPU count,
      # which inside a container is the host's — so set it explicitly).
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Feature flags. Off: every flag uses its default from
      # featureflags/registry.py. On: polls the `unleash` service below
      # (start it with the `flags` profile). The backend never waits for it.
      UNLEASH_ENABLED: ${UNLEASH_ENABLED:-0}
      UNLEASH_URL: ${UNLEASH_URL:-http://unleash:4242/api}
      UNLEASH_API_TOKEN: ${UNLEASH_BACKEND_API_TOKEN}
      UNLEASH_APP_NAME: ${UNLEASH_APP_NAME:-eventhub-backend}
      UNLEASH_ENVIRONMENT: ${UNLEASH_ENVIRONMENT:-production}
    # Only nginx (frontend container) should talk to Django. The port is
    # published on localhost for `npm start` development only.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # python:slim has no curl; /api/health/ also verifies the DB connection.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Background worker: sends emails, delivers webhooks (with retries) and
  # indexes events for search from the job queue; once a minute it also
  # releases expired seat holds and group bookings, advances waitlists and
  # marks past events completed.
  worker:
    build:
      context: ./backend
      args:
        INSTALL_SEMANTIC_SEARCH: ${INSTALL_SEMANTIC_SEARCH:-1}
    container_name: eventhub_worker
    restart: unless-stopped
    entrypoint: ["python", "manage.py", "run_worker"]
    environment: *backend-env
    volumes:
      - backend_media:/app/media
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: eventhub_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
      - "443:443"
    volumes:
      # User uploads are served by nginx directly from the backend's volume.
      - backend_media:/usr/share/nginx/media:ro
      # TLS certificate: put server.crt/server.key here (e.g. from mkcert);
      # a self-signed pair is generated on first start if the folder is empty.
      - ./frontend/certs:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_healthy

  # ---- Freedom Pay gateway emulator (fpay-emulator/README.md) ---- #
  # Demo payments in KZT without a real gateway: the backend calls it at
  # http://fpay-emulator:8080, it calls the backend back with signed Result
  # notifications, and browsers open its payment page at FPAY_PUBLIC_URL.
  # Phone (QR) demo: FPAY_PUBLIC_URL=http://<laptop LAN IP>:18080 and
  # FPAY_EMULATOR_BIND=0.0.0.0 (then also set FPAY_CONTROL_TOKEN).
  fpay-emulator:
    build:
      context: ./fpay-emulator
    container_name: eventhub_fpay_emulator
    restart: unless-stopped
    environment:
      # Same merchant id and secret as the backend's FREEDOMPAY_* settings.
      FPAY_MERCHANTS: ${FREEDOMPAY_MERCHANT_ID:?Set FREEDOMPAY_MERCHANT_ID in .env (see .env.example)}:${FREEDOMPAY_SECRET_KEY:?Set FREEDOMPAY_SECRET_KEY in .env (see .env.example)}
      FPAY_PUBLIC_URL: ${FPAY_PUBLIC_URL:-http://localhost:18080}
      # Control API (/_emulator) token; empty leaves it open (localhost only by default).
      FPAY_CONTROL_TOKEN: ${FPAY_CONTROL_TOKEN:-}
      FPAY_LOG_LEVEL: ${FPAY_LOG_LEVEL:-INFO}
    ports:
      - "${FPAY_EMULATOR_BIND:-127.0.0.1}:18080:8080"
    healthcheck:
      # The image's own check (python:slim has no curl).
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/status/healthcheck', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # ---- Feature flags: self-hosted Unleash (docs/FEATURE_FLAGS.md) ---- #
  # Opt-in profile (`COMPOSE_PROFILES=flags` in .env, or `--profile flags`):
  # the backend runs on flag defaults without it, so the default stack and CI
  # don't depend on it. Its own database: Unleash migrates its schema on every
  # start, and keeping it apart from the app's data keeps backups, restores,
  # credentials and upgrades independent.
  unleash-db:
    image: pgvector/pgvector:pg16
    container_name: eventhub_unleash_db
    profiles: [flags]
    restart: unless-stopped
    environment:
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: ${UNLEASH_DB_PASSWORD:?Set UNLEASH_DB_PASSWORD in .env (see .env.example)}
    volumes:
      - unleash_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash -d unleash"]
      interval: 5s
      timeout: 5s
      retries: 10

  unleash:
    # 8.2.0, pinned by the digest of its multi-arch index (amd64 + arm64).
    image: unleashorg/unleash-server:8.2.0@sha256:5020013b7a9a93c8ed3686d36b5025399714020b3fb5ef41afd84ba37a88c050
    container_name: eventhub_unleash
    profiles: [flags]
    restart: unless-stopped
    environment:
      DATABASE_HOST: unleash-db
      DATABASE_PORT: 5432
      DATABASE_NAME: unleash
      DATABASE_USERNAME: unleash
      DATABASE_PASSWORD: ${UNLEASH_DB_PASSWORD}
      DATABASE_SSL: "false"
      # Public address of the admin UI (links in emails / invitations).
      UNLEASH_URL: ${UNLEASH_PUBLIC_URL:-http://localhost:4242}
      # The first admin account, created on the first start only; change the
      # password in the UI afterwards (changing it here has no effect).
      UNLEASH_DEFAULT_ADMIN_USERNAME: admin
      UNLEASH_DEFAULT_ADMIN_PASSWORD: ${UNLEASH_ADMIN_PASSWORD:?Set UNLEASH_ADMIN_PASSWORD in .env (see .env.example)}
      # Tokens created on the first start (only while no token exists yet);
      # rotate them in the UI or API afterwards. The backend token is the one
      # the backend polls with; an admin token is for local automation only.
      INIT_BACKEND_API_TOKENS: ${UNLEASH_BACKEND_API_TOKEN:?Set UNLEASH_BACKEND_API_TOKEN in .env (see .env.example)}
      INIT_ADMIN_API_TOKENS: ${UNLEASH_ADMIN_API_TOKEN:-}
      # No calls home.
      CHECK_VERSION: "false"
      SEND_TELEMETRY: "false"
      LOG_LEVEL: ${UNLEASH_LOG_LEVEL:-warn}
    # Admin UI for operators on this machine only (an SSH tunnel on a server).
    ports:
      - "127.0.0.1:${UNLEASH_HOST_PORT:-4242}:4242"
    depends_on:
      unleash-db:
        condition: service_healthy
    healthcheck:
      # The image has busybox wget, no curl. /health answers once migrations ran.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4242/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  postgres_data:
  backend_media:
  unleash_db_data:
