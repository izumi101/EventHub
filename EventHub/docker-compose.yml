# Defaults here are safe for a server (DEBUG off, no demo data, no fake
# payments). For local development copy .env.example to .env — it turns on
# DEBUG, mock payments and demo data.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: eventhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventhub}
      POSTGRES_USER: ${POSTGRES_USER:-eventhub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eventhub_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        INSTALL_SEMANTIC_SEARCH: ${INSTALL_SEMANTIC_SEARCH:-1}
    container_name: eventhub_backend
    restart: unless-stopped
    environment: &backend-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env (see .env.example)}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:4200,https://localhost}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:4200,https://localhost}
      DJANGO_SEED_DATA: ${DJANGO_SEED_DATA:-0}
      DJANGO_SEED_ADMIN_PASSWORD: ${DJANGO_SEED_ADMIN_PASSWORD:-}
      DJANGO_COLLECTSTATIC: ${DJANGO_COLLECTSTATIC:-0}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      POSTGRES_DB: ${POSTGRES_DB:-eventhub}
      POSTGRES_USER: ${POSTGRES_USER:-eventhub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_MOCK_MODE: ${STRIPE_MOCK_MODE:-0}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-EventHub <no-reply@eventhub.local>}
      JOBS_RUN_INLINE: ${JOBS_RUN_INLINE:-0}
      # gunicorn worker processes per backend container (default: CPU count,
      # which inside a container is the host's — so set it explicitly).
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    # Only nginx (frontend container) should talk to Django. The port is
    # published on localhost for `npm start` development only.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # python:slim has no curl; /api/health/ also verifies the DB connection.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Background worker: sends emails, delivers webhooks (with retries) and
  # indexes events for search from the job queue; once a minute it also
  # releases expired seat holds and group bookings, advances waitlists and
  # marks past events completed.
  worker:
    build:
      context: ./backend
      args:
        INSTALL_SEMANTIC_SEARCH: ${INSTALL_SEMANTIC_SEARCH:-1}
    container_name: eventhub_worker
    restart: unless-stopped
    entrypoint: ["python", "manage.py", "run_worker"]
    environment: *backend-env
    volumes:
      - backend_media:/app/media
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: eventhub_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
      - "443:443"
    volumes:
      # User uploads are served by nginx directly from the backend's volume.
      - backend_media:/usr/share/nginx/media:ro
      # TLS certificate: put server.crt/server.key here (e.g. from mkcert);
      # a self-signed pair is generated on first start if the folder is empty.
      - ./frontend/certs:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_media:
