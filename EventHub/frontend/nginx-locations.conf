# Общие директивы для HTTP (80) и HTTPS (443) server-блоков.
# Подключается через `include` в nginx.conf.

root /usr/share/nginx/html;
index index.html;

# ── Gzip Compression ──
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/woff2;

# ── Security Headers ──
include /etc/nginx/snippets/security-headers.conf;

# ── WebSocket Proxy (Django Channels / real-time seat map) ──
location /ws/ {
    proxy_pass http://backend:8000/ws/;
    proxy_http_version 1.1;
    # Required headers for WebSocket upgrade
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite (not append): the backend trusts exactly one proxy hop, so a
    # client-supplied X-Forwarded-For must never reach it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;  # keep WS alive up to 24h
    proxy_send_timeout 86400s;
}

# ── API Proxy ──
location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_read_timeout 60s;
    client_max_body_size 10m;
}

# ── Django static files (admin, API docs), served by WhiteNoise ──
# ^~ wins over the regex location for the SPA's assets below.
location ^~ /static/ {
    proxy_pass http://backend:8000/static/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
}

# ── User uploads (avatars, event images) ──
# Served straight from the shared media volume — Django serves /media/ only
# with DEBUG on. ^~ wins over the regex location for static assets below.
location ^~ /media/ {
    alias /usr/share/nginx/media/;
    expires 7d;
    add_header Cache-Control "public, no-transform";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Uploaded files are data, never active content.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
}

# ── Static Assets (hashed filenames) ──
location ~* \.(js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    access_log off;
}

# ── Angular SPA Fallback ──
location / {
    try_files $uri $uri/ /index.html;
}
