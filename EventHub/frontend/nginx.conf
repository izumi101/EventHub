# ── HTTP (port 80 → host 4200): desktop access at http://localhost:4200 ──
server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/eventhub-locations.conf;
}

# ── HTTPS (port 443): the camera needs it (getUserMedia requires a secure context) ──
# From a phone: https://<computer-IP>/  (accept the self-signed certificate warning).
# Certificate: frontend/certs/server.{crt,key}; without them the container creates a self-signed one at start.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    # HSTS: see nginx-security-headers.conf (enable only with a trusted cert).

    include /etc/nginx/snippets/eventhub-locations.conf;
}
