<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>EventHub — Discover Events That Matter</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="EventHub — Discover and book concerts, festivals, conferences, and workshops worldwide. Built for event lovers, by event lovers."
    />
    <meta
      name="keywords"
      content="events, concerts, festivals, conferences, workshops, tickets, booking"
    />
    <meta name="author" content="EventHub" />
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph -->
    <meta property="og:title" content="EventHub — Discover Events That Matter" />
    <meta
      property="og:description"
      content="From intimate concerts to global conferences. Find your next unforgettable experience."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EventHub" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EventHub — Discover Events" />
    <meta
      name="twitter:description"
      content="From intimate concerts to global conferences. Find your next unforgettable experience."
    />

    <!-- Favicon and app icons -->
    <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/icon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/brand/icon-16.png?v=2" />
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/brand/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="assets/brand/site.webmanifest?v=2" />

    <!-- Self-hosted Onest (variable). Preload the Latin and Cyrillic subsets every page
         uses; Kazakh letters (cyrillic-ext) and ₸ (latin-ext) load on demand. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/assets/fonts/onest-latin.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/assets/fonts/onest-cyrillic.woff2"
    />

    <!-- Inline critical loading styles -->
    <style>
      .app-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #faf7f2;
        flex-direction: column;
        gap: 1.25rem;
      }
      .app-loader-logo {
        width: 48px;
        height: 48px;
        display: block;
      }
      .app-loader-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid #ece6dd;
        border-top-color: #e8643a;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        .app-loader {
          background: #121110;
        }
        .app-loader-spinner {
          border-color: #2f2a25;
          border-top-color: #e8643a;
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <!-- Loading screen shown while Angular bootstraps -->
      <div class="app-loader">
        <img class="app-loader-logo" src="assets/brand/symbol.svg?v=2" alt="EventHub" />
        <div class="app-loader-spinner"></div>
      </div>
    </app-root>
  </body>
</html>
