      - id
      - offer_expires_at
      - position
      - status
      - username
    WaitlistEntryStatusEnum:
      enum:
      - waiting
      - offered
      - converted
      - expired
      type: string
      description: |-
        * `waiting` - Waiting
        * `offered` - Offered
        * `converted` - Converted
        * `expired` - Expired
    WaitlistStatus:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/WaitlistStatusEnum'
        position:
          type: integer
          nullable: true
