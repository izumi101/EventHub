          readOnly: true
        event:
          type: integer
          readOnly: true
        event_title:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/WaitlistEntryStatusEnum'
          readOnly: true
        position:
          type: integer
          readOnly: true
        offer_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
