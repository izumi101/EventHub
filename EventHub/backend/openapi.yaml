openapi: 3.0.3
info:
  title: EventHub API
  version: 1.0.0
  description: 'Events, tickets, seat maps, payments and check-in. Authenticate with
    `Authorization: Bearer <access token>` from `POST /api/v1/auth/login/`. Errors
    are `{"error": "<message>"}`, with a stable `code` where clients branch on it.'
paths:
  /api/v1/admin-dashboard/:
    get:
      operationId: admin_dashboard_retrieve
      tags:
      - admin-dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid access token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request was refused; see `error`.
  /api/v1/affiliates/{id}/:
    get:
      operationId: affiliates_retrieve
      description: Base for detail views restricted to the event's managers.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - affiliates
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Affiliate'
          description: ''
    put:
      operationId: affiliates_update
      description: Base for detail views restricted to the event's managers.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - affiliates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffiliateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AffiliateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AffiliateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Affiliate'
          description: ''
    patch:
      operationId: affiliates_partial_update
      description: Base for detail views restricted to the event's managers.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - affiliates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAffiliateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAffiliateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAffiliateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Affiliate'
          description: ''
    delete:
      operationId: affiliates_destroy
      description: Base for detail views restricted to the event's managers.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - affiliates
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/admin/organizers/:
    post:
      operationId: auth_admin_organizers_create
      description: |-
        Admin-only: creates an organizer account.
        Attendees cannot promote themselves — this is the only way to get the role.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizerCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizerCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizerCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'Validation failed: field name → list of messages (`non_field_errors`
            for the request as a whole).'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid access token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not allowed for this user.
  /api/v1/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: |-
        Change password for authenticated users (old password required).

        Every other session is signed out; the response carries a fresh token
        pair for the current device.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request was refused; see `error`.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid access token.
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Handles user login, supporting both username and email as identifiers.
        Returns access and refresh JWT tokens on successful authentication.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'Validation failed: field name → list of messages (`non_field_errors`
            for the request as a whole).'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request was refused; see `error`.
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists the user's refresh token to sign out.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid access token.
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Resets the user's password using the one-time reset token.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request was refused; see `error`.
  /api/v1/auth/password-reset/request/:
    post:
      operationId: auth_password_reset_request_create
      description: Sends a 6-digit password reset code to the user's associated email
        if the account exists.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IdentifierRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IdentifierRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request was refused; see `error`.
  /api/v1/auth/password-reset/verify/:
    post:
      operationId: auth_password_reset_verify_create
      description: Verifies the password reset code and returns a one-time reset token.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierCodeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IdentifierCodeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IdentifierCodeRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetTokenResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request was refused; see `error`.
  /api/v1/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      description: Retrieves or updates the authenticated user's profile.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid access token.
    put:
      operationId: auth_profile_update
      description: Retrieves or updates the authenticated user's profile.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'Validation failed: field name → list of messages (`non_field_errors`
            for the request as a whole).'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid access token.
  /api/v1/auth/profile/avatar/:
    post:
      operationId: auth_profile_avatar_create
      description: Upload (or clear) the authenticated user's profile avatar.
      tags:
      - auth
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AvatarUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request was refused; see `error`.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid access token.
    delete:
      operationId: auth_profile_avatar_destroy
      description: Upload (or clear) the authenticated user's profile avatar.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid access token.
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: |-
        Handles new user registration.
        Validates user credentials, verification code, and creates the user profile.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'Validation failed: field name → list of messages (`non_field_errors`
            for the request as a whole).'
  /api/v1/auth/register/send-code/:
    post:
      operationId: auth_register_send_code_create
      description: Sends a registration verification code to the target email.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendCodeResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request was refused; see `error`.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request was refused; see `error`.
  /api/v1/auth/register/verify-code/:
    post:
      operationId: auth_register_verify_code_create
      description: Verifies the email registration code.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailCodeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailCodeRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request was refused; see `error`.
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/bookings/:
    post:
      operationId: bookings_create
      description: POST /api/bookings/  — hold a group of seats.
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request was refused; see `error`.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid access token.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No such object (or not visible to you).
  /api/v1/bookings/{id}/:
    get:
      operationId: bookings_retrieve
      description: GET /api/bookings/{id}/  — owner views their booking.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid access token.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No such object (or not visible to you).
  /api/v1/bookings/{id}/cancel/:
    post:
      operationId: bookings_cancel_create
      description: POST /api/bookings/{id}/cancel/  — release the held seats.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingStatus'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request was refused; see `error`.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid access token.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No such object (or not visible to you).
  /api/v1/bookings/{id}/checkout/:
    post:
      operationId: bookings_checkout_create
      description: POST /api/bookings/{id}/checkout/  — pay for the whole group.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCheckoutResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request was refused; see `error`.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid access token.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No such object (or not visible to you).
  /api/v1/bookings/{id}/refund/:
    post:
      operationId: bookings_refund_create
      description: POST /api/bookings/{id}/refund/  — the event team refunds one paid
        group booking.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRefundRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingRefundRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingRefundRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request was refused; see `error`.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid access token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request was refused; see `error`.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No such object (or not visible to you).
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request was refused; see `error`.
  /api/v1/bookings/event/{event_id}/:
    get:
      operationId: bookings_event_list
      description: GET /api/bookings/event/{event_id}/  — the event team lists group
        bookings.
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid access token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request was refused; see `error`.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No such object (or not visible to you).
  /api/v1/bookings/mine/:
    get:
      operationId: bookings_mine_list
      description: GET /api/bookings/  — list the user's confirmed/holding bookings.
      tags:
      - bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid access token.
  /api/v1/bookings/shared/{token}/:
    get:
      operationId: bookings_shared_retrieve
      description: GET /api/bookings/shared/{token}/  — friends open the invite link.
      parameters:
      - in: path
        name: token
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bookings
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '404':
          content:
            application/json:
