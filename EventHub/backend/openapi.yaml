      - spots_available
      - left
      - not_joined
      type: string
      description: |-
        * `waiting` - waiting
        * `offered` - offered
        * `converted` - converted
        * `expired` - expired
        * `spots_available` - spots_available
        * `left` - left
        * `not_joined` - not_joined
    Webhook:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          maxLength: 500
        secret:
          type: string
          description: Used to sign payloads
          maxLength: 64
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/WebhookTriggerEnum'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_triggered_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_status:
          type: integer
          readOnly: true
          nullable: true
