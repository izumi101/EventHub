    put:
      operationId: webhooks_update
      description: Base for detail views restricted to the event's managers.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
          description: ''
    patch:
      operationId: webhooks_partial_update
      description: Base for detail views restricted to the event's managers.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWebhookRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWebhookRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWebhookRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
          description: ''
    delete:
      operationId: webhooks_destroy
      description: Base for detail views restricted to the event's managers.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - webhooks
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
