      - created_at
      - deliveries_count
      - id
      - is_active
      - last_status
      - last_triggered_at
      - secret
      - triggers
      - url
    WebhookRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 500
        secret:
          type: string
          description: Used to sign payloads
          maxLength: 64
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/WebhookTriggerEnum'
        is_active:
